<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Task">
  <meta name="theme-color" content="#f6f4ef">
  <title>My Task Assistant</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ===== ヘッダー（アプリ名とタブ） ===== -->
  <header class="app-header">
    <h1 class="app-title">My Task Assistant</h1>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" role="tab" data-category="work">💼 仕事</button>
      <button class="tab" role="tab" data-category="private">🏠 プライベート</button>
    </nav>
  </header>

  <main class="container">
    <!-- ===== タスク入力欄 ===== -->
    <form id="add-form" class="add-form" autocomplete="off">
      <input id="add-input" class="add-input" type="text"
             placeholder="思いついたことを入力（例：牛乳を買う）" enterkeyhint="done">
      <button class="btn btn-primary add-button" type="submit">追加</button>
    </form>

    <!-- ===== 絞り込み（すべて・今日・今週…） ===== -->
    <div class="filters" id="filters">
      <button class="chip is-active" data-filter="all">すべて</button>
      <button class="chip" data-filter="today">今日</button>
      <button class="chip" data-filter="week">今週</button>
      <button class="chip" data-filter="nodue">期限なし</button>
      <button class="chip" data-filter="done">完了済み</button>
    </div>

    <!-- ===== タスク一覧 ===== -->
    <p id="summary" class="summary"></p>
    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden></p>
  </main>

  <!-- ===== 編集画面（タスクをタップすると開く） ===== -->
  <dialog id="edit-dialog" class="dialog">
    <form id="edit-form" method="dialog" class="edit-form">
      <h2 class="dialog-title">タスクを編集</h2>

      <label class="field">
        <span class="field-label">タスク名</span>
        <input id="edit-title" type="text" required>
      </label>

      <div class="field">
        <span class="field-label">カテゴリ</span>
        <div class="segmented" id="edit-category">
          <button type="button" data-value="work">💼 仕事</button>
          <button type="button" data-value="private">🏠 プライベート</button>
        </div>
      </div>

      <div class="field">
        <span class="field-label">期限</span>
        <div class="quick-dates">
          <button type="button" class="chip" data-quick="today">今日</button>
          <button type="button" class="chip" data-quick="tomorrow">明日</button>
          <button type="button" class="chip" data-quick="weekend">今週末</button>
          <button type="button" class="chip" data-quick="none">なし</button>
        </div>
        <input id="edit-due" type="date">
      </div>

      <!-- 期限の日に通知を鳴らすため、iPad のカレンダーに登録する -->
      <div class="field">
        <span class="field-label">通知（iPadのカレンダーに登録）</span>
        <div class="reminder-row">
          <input id="reminder-time" type="time" value="09:00" aria-label="通知の時刻">
          <button type="button" id="calendar-button" class="btn btn-calendar">🔔 カレンダーに追加</button>
        </div>
        <p id="reminder-hint" class="field-hint"></p>
      </div>

      <div class="field">
        <span class="field-label">優先順位</span>
        <div class="segmented" id="edit-priority">
          <button type="button" data-value="high">高</button>
          <button type="button" data-value="medium">中</button>
          <button type="button" data-value="low">低</button>
        </div>
      </div>

      <label class="field">
        <span class="field-label">メモ</span>
        <textarea id="edit-memo" rows="3" placeholder="自由にメモできます"></textarea>
      </label>

      <div class="dialog-actions">
        <button type="button" id="delete-button" class="btn btn-danger">削除</button>
        <span class="spacer"></span>
        <button type="button" id="cancel-button" class="btn">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- ===== 画面下に一時的に出るお知らせ ===== -->
  <div id="toast" class="toast" hidden>
    <span id="toast-message"></span>
    <button id="toast-undo" class="toast-undo" hidden>元に戻す</button>
  </div>

  <!-- 読み込む順番が大切：先に保存担当、次に画面の動き -->
  <script src="js/storage.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
